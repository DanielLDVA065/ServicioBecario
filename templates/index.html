<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIFAR-10</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Clasificador CIFAR-10</h1>
        <p>Sube una imagen para obtener una predicción</p>
        <input type="file" id="imageInput">
        <button onclick="sendImage()">Predecir</button>
        <h2 id="result"></h2>
    </div>

    <script>
        async function sendImage() {
            const input = document.getElementById("imageInput");
            const file = input.files[0];
            if (!file) {
                alert("Selecciona una imagen");
                return;
            }
            const formData = new FormData();
            formData.append("file", file);
            const response = await fetch("/predict", {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            if (data.prediction) {
                document.getElementById("result").innerText = "Predicción: " + data.prediction;
            } else {
                document.getElementById("result").innerText = "Error al procesar imagen";
            }
        }
    </script>
</body>
</html>
